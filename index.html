/* ================= MAINTENANCE ================= */
async function renderMtc(){
  let h = `<h2>Maintenance Terjadwal</h2>
    ${isMgr()?`<button class="btn btn-teal" style="margin-bottom:12px" onclick="newMtcModal()">+ Jadwal Baru</button>`:''}
    <div id="mtcList"></div>`;
  $('main').innerHTML = h; loadMtc();
}
async function loadMtc(){
  const [list, openSessions] = await Promise.all([
    q(db.from('maintenance_schedules').select('*, assets(name)').eq('active',true).order('next_due')),
    q(db.from('maintenance_logs').select('*').is('end_time', null))
  ]);
  const t = today();
  let h = list.length?'':'<p class="muted">Belum ada jadwal maintenance.</p>';
  list.forEach(s=>{
    const canDo = isMgr() || (isFieldWorker()&&me.department===s.department);
    const due = s.next_due<=t;
    const active = openSessions.find(o=>o.schedule_id===s.id);
    h += `<div class="item" style="border-left-color:${DEPTS[s.department].color};cursor:default">
      <div class="row" style="justify-content:space-between">
        <div>${deptTag(s.department)} <b>${esc(s.task_name)}</b>${s.assets?` <span class="small muted">(${esc(s.assets.name)})</span>`:''}</div>
        <span class="small ${due?'age-red':(s.next_due<=addDays(t,7)?'age-amber':'muted')}">${due?'JATUH TEMPO · ':''}${fdate(s.next_due)}</span></div>
      <div class="small muted">Setiap ${s.interval_days} hari</div>
      ${active?`<div class="small" style="color:var(--teal-d);font-weight:700;margin-top:4px">⏱ Sedang dikerjakan oleh ${uname(active.done_by)} sejak ${fdt(active.start_time)}</div>`:''}
      ${canDo?`<div class="row" style="margin-top:6px">
        ${active
          ? `<button class="btn btn-teal btn-sm" onclick="finishMtc(${active.id},${s.id},${s.interval_days})">✓ Selesai Dikerjakan</button>`
          : `<button class="btn btn-navy btn-sm" onclick="startMtc(${s.id})">▶ Mulai Kerjakan</button>`}
        ${isMgr()?`<button class="btn btn-ghost btn-sm" onclick="delMtc(${s.id})">Nonaktifkan</button>`:''}</div>`:''}</div>`;
  });
  $('mtcList').innerHTML = h;
}
async function newMtcModal(){
  const assets = await q(db.from('assets').select('id,name,department').eq('status','aktif').order('name'));
  window._assets = assets;
  openModal(`<div class="mhead"><h3>Jadwal Maintenance Baru</h3><button onclick="closeModal()">✕</button></div>
    <label>Departemen</label><select id="nmDept" onchange="nmFilterAssets()">${deptOptions()}</select>
    <label>Aset Terkait (opsional)</label><select id="nmAsset"></select>
    <label>Nama Tugas</label><input id="nmTask" placeholder="mis. Servis pompa filter, backwash total">
    <label>Interval (hari)</label><input id="nmInt" type="number" value="30">
    <label>Jatuh Tempo Pertama</label><input id="nmDue" type="date" value="${today()}">
    <button class="btn btn-teal" style="margin-top:14px;width:100%" onclick="createMtc()">Simpan Jadwal</button>`);
  nmFilterAssets();
}
function nmFilterAssets(){
  const d=$('nmDept').value;
  $('nmAsset').innerHTML = '<option value="">— umum —</option>' +
    window._assets.filter(a=>a.department===d).map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
}
async function createMtc(){
  const n=$('nmTask').value.trim(); if(!n){toast('Nama tugas wajib');return;}
  await q(db.from('maintenance_schedules').insert({department:$('nmDept').value,asset_id:$('nmAsset').value||null,
    task_name:n,interval_days:Number($('nmInt').value)||30,next_due:$('nmDue').value}).select());
  closeModal(); toast('Jadwal tersimpan'); loadMtc();
}
async function startMtc(scheduleId){
  await q(db.from('maintenance_logs').insert({schedule_id:scheduleId, done_by:me.id, start_time:new Date().toISOString()}).select());
  toast('Pekerjaan dimulai, jam tercatat'); loadMtc();
}
async function finishMtc(logId, scheduleId, interval){
  const note = prompt('Catatan pengerjaan (opsional):') || null;
  await q(db.from('maintenance_logs').update({end_time:new Date().toISOString(), done_date:today(), note}).eq('id',logId));
  await q(db.from('maintenance_schedules').update({next_due:addDays(today(),interval)}).eq('id',scheduleId));
  toast('Pekerjaan selesai, jam kerja tercatat'); loadMtc();
}
async function delMtc(id){
  if(!confirm('Nonaktifkan jadwal ini?'))return;
  await q(db.from('maintenance_schedules').update({active:false}).eq('id',id));
  loadMtc();
}

function empoweredSpvFor(dept){
  return profilesCache.find(p=>p.role==='spv' && p.department===dept && p.can_approve_lembur && p.active);

function myApprovableDepts(){

async function openLembur(id){
  const [r] = await q(db.from('overtime_requests').select('*').eq('id',id));
  const canDecide = isMgr() || (me.role==='spv' && me.can_approve_lembur && me.department===r.department);
  let h = `<div class="mhead"><h3>Pengajuan Lembur</h3><button onclick="closeModal()">✕</button></div>
    <div class="row">${deptTag(r.department)} <span class="badge" style="background:${LSTAT[r.status].c};color:${LSTAT[r.status].t}">${LSTAT[r.status].l}</span></div>
    <p class="small muted">Diajukan oleh ${uname(r.staff_id)} · ${fdt(r.created_at)}</p>
    <p class="small"><b>Tanggal:</b> ${fdate(r.requested_date)}<br>
    <b>Rencana Jam:</b> ${r.planned_start||'-'} – ${r.planned_end||'-'}<br>
    <b>Alasan:</b> ${esc(r.reason)}</p>`;
  if(r.status==='diajukan' && canDecide){
    h += `<div class="row" style="margin-top:12px">
      <button class="btn btn-teal btn-sm" onclick="decideLembur(${r.id},true)">✓ Setujui</button>
      <button class="btn btn-ghost btn-sm" onclick="decideLembur(${r.id},false)">Tolak</button></div>`;

async function renderRekap(){
  const m = today().slice(0,7);
  $('main').innerHTML = `<h2>Rekap Bulanan</h2>
    <div class="card"><label>Pilih Bulan</label><input type="month" id="rkMonth" value="${m}" onchange="loadRekap()"></div>
    <div id="rkArea"></div>`;
  loadRekap();
}
async function loadRekap(){
  const m = $('rkMonth').value;
  const from = m+'-01';
  const daysInMonth = new Date(Number(m.slice(0,4)), Number(m.slice(5,7)), 0).getDate();
  const lastDay = m + '-' + String(daysInMonth).padStart(2,'0');
  const isCurrent = m === today().slice(0,7);
  const effDays = isCurrent ? Number(today().slice(8,10)) : daysInMonth;

  const [logs, tickets, items, assetsIn, dispOut] = await Promise.all([
    q(db.from('daily_logs').select('id,log_date,department').gte('log_date',from).lte('log_date',lastDay)),
    q(db.from('tickets').select('*').gte('created_at',from).lte('created_at',lastDay+'T23:59:59')),
    q(db.from('ticket_items').select('*, tickets!inner(department,created_at)').gte('tickets.created_at',from).lte('tickets.created_at',lastDay+'T23:59:59')),
    q(db.from('assets').select('id,department,created_at').gte('created_at',from).lte('created_at',lastDay+'T23:59:59')),
    q(db.from('asset_disposals').select('*, assets(department,name)').eq('status','disetujui').gte('decided_at',from).lte('decided_at',lastDay+'T23:59:59'))
  ]);
  const closedThisMonth = await q(db.from('tickets').select('*').eq('status','selesai').gte('closed_at',from).lte('closed_at',lastDay+'T23:59:59'));

  let h = '';
  // Kepatuhan log
  h += `<div class="card"><h3>Kepatuhan Pengisian Log (${effDays} hari)</h3><table class="respTable"><tr><th>Dept</th><th>Terisi</th><th>%</th></tr>`;
  for(const d in DEPTS){
    const n = logs.filter(l=>l.department===d).length;
    const pct = effDays? Math.round(n/effDays*100):0;
    h += `<tr><td data-label="Dept">${deptTag(d)}</td><td data-label="Terisi">${n}/${effDays}</td>
      <td data-label="%" style="font-weight:800;color:${pct>=90?'var(--green)':pct>=60?'var(--amber)':'var(--red)'}">${pct}%</td></tr>`;
  }
  h += `</table></div>`;

  // Tiket
  const avgDays = closedThisMonth.length
    ? (closedThisMonth.reduce((s,t)=>s+(new Date(t.closed_at)-new Date(t.created_at))/86400000,0)/closedThisMonth.length).toFixed(1) : '-';
  h += `<div class="grid3" style="margin-bottom:14px">
    <div class="stat"><div class="n">${tickets.length}</div><div class="l">Tiket Baru</div></div>
    <div class="stat"><div class="n" style="color:var(--green)">${closedThisMonth.length}</div><div class="l">Tiket Selesai</div></div>
    <div class="stat"><div class="n">${avgDays}</div><div class="l">Rata² Hari Selesai</div></div></div>`;

  // Biaya per departemen (realisasi jika ada, jika tidak perkiraan)
  const cost = {};
  items.forEach(i=>{
    const d = i.tickets.department;
    cost[d] = cost[d]||{est:0,act:0};
    cost[d].est += i.qty*i.est_price;
    if(i.actual_price!=null) cost[d].act += i.qty*i.actual_price;
  });
  h += `<div class="card"><h3>Biaya Perbaikan per Departemen</h3><table class="respTable"><tr><th>Dept</th><th>Perkiraan</th><th>Realisasi</th></tr>`;
  let te=0, ta=0;
  for(const d in DEPTS){ const c=cost[d]||{est:0,act:0}; te+=c.est; ta+=c.act;
    h += `<tr><td data-label="Dept">${deptTag(d)}</td><td data-label="Perkiraan">${rp(c.est)}</td><td data-label="Realisasi">${rp(c.act)}</td></tr>`; }
  h += `<tr><td data-label="Total"><b>Total</b></td><td data-label="Perkiraan"><b>${rp(te)}</b></td><td data-label="Realisasi"><b>${rp(ta)}</b></td></tr></table></div>`;

  // Aset masuk/keluar
  h += `<div class="card"><h3>Mutasi Aset Bulan Ini</h3>
    <p class="small"><b>Masuk:</b> ${assetsIn.length} aset · <b>Keluar (disposal disetujui):</b> ${dispOut.length} aset</p>`;
  if(dispOut.length){
    h += `<table class="respTable"><tr><th>Aset</th><th>Dept</th><th>Alasan</th><th>Disetujui</th></tr>`;
    dispOut.forEach(x=> h += `<tr><td data-label="Aset">${esc(x.assets.name)}</td><td data-label="Dept">${deptTag(x.assets.department)}</td>
      <td data-label="Alasan" class="small">${esc(x.reason)}</td><td data-label="Disetujui" class="small">${uname(x.decided_by)} · ${fdt(x.decided_at)}</td></tr>`);
    h += `</table>`;
  }
  h += `</div>`;
  $('rkArea').innerHTML = h;
}

async function saveUser(id){
  const usernameRaw = $('uu-'+id).value.trim().toLowerCase();
  if(usernameRaw){
    if(!/^[a-z0-9._-]{3,30}$/.test(usernameRaw)){
      toast('Username hanya huruf kecil/angka/titik/garis, 3-30 karakter'); return;
    }
    const dup = await q(db.from('profiles').select('id').eq('username',usernameRaw));
    if(dup.length && dup[0].id !== id){ toast('Username sudah dipakai orang lain'); return; }
  }
  const upd = {name:$('un-'+id).value.trim(), username: usernameRaw||null, role:$('ur-'+id).value,
    department:$('ud-'+id).value||null, active:$('ua-'+id).checked};
  const cbEl = $('uc-'+id);
  if(cbEl) upd.can_approve_lembur = cbEl.checked; // hanya ada di DOM untuk viewer Manager/Owner
  await q(db.from('profiles').update(upd).eq('id',id));
  toast('Pengguna diperbarui');
  profilesCache = await q(db.from('profiles').select('*'));
  if(id===me.id) me = profilesCache.find(p=>p.id===me.id);
}

/* ---------- Daftarkan Karyawan Baru (tanpa buka Supabase) ---------- */
function newEmployeeModal(){
  openModal(`<div class="mhead"><h3>Daftarkan Karyawan Baru</h3><button onclick="closeModal()">✕</button></div>
    <label>Nama Lengkap</label><input id="neName" placeholder="mis. Budi Santoso">
    <label>Username (huruf kecil, tanpa spasi)</label><input id="neUser" placeholder="mis. budi.pool" autocapitalize="off">
    <label>Role</label><select id="neRole">${Object.entries(ROLES).filter(([k])=>k!=='kiosk'||isMgr()).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
    <label>Departemen (kosongkan untuk role non-operasional)</label>
    <select id="neDept"><option value="">-</option>${Object.entries(ALL_STAFF_DEPTS).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('')}</select>
    <label>Password Awal (min. 6 karakter)</label><input id="nePass" type="text" placeholder="mis. aa12345">
    <p class="small muted" style="margin-top:6px">Sampaikan username &amp; password ini ke karyawan secara langsung. Mereka bisa ganti password sendiri setelah login pertama.</p>
    <button class="btn btn-teal" style="margin-top:14px;width:100%" onclick="submitNewEmployee()">Daftarkan</button>`);
}
async function submitNewEmployee(){
  const name = $('neName').value.trim();
  const usernameRaw = $('neUser').value.trim().toLowerCase();
  const role = $('neRole').value;
  const department = $('neDept').value || null;
  const pass = $('nePass').value;
  if(!name){ toast('Nama wajib diisi'); return; }
  if(!/^[a-z0-9._-]{3,30}$/.test(usernameRaw)){ toast('Username hanya huruf kecil/angka/titik/garis, 3-30 karakter'); return; }
  if(pass.length < 6){ toast('Password minimal 6 karakter'); return; }
  const existing = await q(db.from('profiles').select('id').eq('username',usernameRaw));
  if(existing.length){ toast('Username sudah dipakai, pilih yang lain'); return; }
  const email = synthEmail(usernameRaw);
  // Pakai koneksi Supabase TERPISAH khusus untuk signUp ini, supaya sesi
  // login diri sendiri (HRD/Manager/Owner) tidak ikut tergantikan.
  const tempClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {auth:{persistSession:false}});
  const {data, error} = await tempClient.auth.signUp({email, password:pass, options:{data:{name}}});
  if(error){ toast('Gagal daftar: '+error.message); return; }
  const newId = data.user?.id;
  if(!newId){ toast('Gagal mendapatkan akun baru, coba lagi'); return; }
  // Trigger di database otomatis bikin baris profiles dasar; sekarang lengkapi.
  await q(db.from('profiles').update({username:usernameRaw, role, department, active:true}).eq('id',newId));
  closeModal(); toast('Karyawan berhasil didaftarkan');
  profilesCache = await q(db.from('profiles').select('*'));
  if(page==='users') renderUsers();
}

/* ---------- Ganti Password Sendiri ---------- */
function changePasswordModal(){
  openModal(`<div class="mhead"><h3>Ganti Password</h3><button onclick="closeModal()">✕</button></div>
    <label>Password Baru (min. 6 karakter)</label><input id="cpNew" type="password">
    <label>Ulangi Password Baru</label><input id="cpConfirm" type="password">
    <button class="btn btn-teal" style="margin-top:14px;width:100%" onclick="submitChangePassword()">Simpan Password</button>`);
}
async function submitChangePassword(){
  const p1 = $('cpNew').value, p2 = $('cpConfirm').value;
  if(p1.length < 6){ toast('Password minimal 6 karakter'); return; }
  if(p1 !== p2){ toast('Konfirmasi password tidak sama'); return; }
  const {error} = await db.auth.updateUser({password:p1});
  if(error){ toast('Gagal ganti password: '+error.message); return; }
  closeModal(); toast('Password berhasil diganti');
}

/* Enter untuk login */
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && !$('loginView').classList.contains('hidden')) doLogin(); });
init();
